# MCP Server Configurations
# Reference: https://modelcontextprotocol.io/

servers:
  filesystem:
    command: npx
    args:
      ["-y", "@modelcontextprotocol/server-filesystem", "${WORKING_DIRECTORY}"]
    description: Local filesystem access for data files

  web-search:
    command: npx
    args: ["-y", "@youdotcom-oss/mcp"]
    env:
      # Free keyless tier, no API key needed. To use your own key, remove
      # YDC_PROFILE and set YDC_API_KEY in .env.
      YDC_PROFILE: free
    description: Web search capabilities (You.com)

  github:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
    description: GitHub repository access

# Default servers enabled for all agents (can be overridden per-agent)
defaults:
  - filesystem
