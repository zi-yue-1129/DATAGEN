agents:
  hypothesis_agent:
    provider: openai
    model_config:
      model: gpt-5.6-terra
      temperature: 1.0
    max_iterations: 15
  process_agent:
    provider: google
    # Gemini 3.x uses fixed sampling defaults, so temperature is ignored.
    model_config:
      model: gemini-3.1-pro-preview
    max_iterations: 15
  visualization_agent:
    provider: openai
    model_config:
      model: gpt-5.6-luna
      temperature: 1.0
    max_iterations: 15
  code_agent:
    provider: anthropic
    # Sonnet 5 rejects any temperature other than the default.
    model_config:
      model: claude-sonnet-5
    max_iterations: 10
  search_agent:
    provider: google
    model_config:
      model: gemini-3.8-flash
    max_iterations: 15
  report_agent:
    provider: openai
    model_config:
      model: gpt-5.6-luna
      temperature: 1.0
    max_iterations: 15
  quality_review_agent:
    provider: openai
    model_config:
      model: gpt-5.6-terra
      temperature: 1.0
    max_iterations: 15
  note_agent:
    provider: google
    model_config:
      model: gemini-3.1-pro-preview
    max_iterations: 15
  refiner_agent:
    provider: openai
    model_config:
      model: gpt-5.6-luna
      temperature: 1.0
    max_iterations: 15
